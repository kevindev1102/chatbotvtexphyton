[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatbot-vtex-python"
version = "1.0.0"
description = "Chatbot de Coolbox integrado con OpenAI, VTEX y Web API/CIC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "openai>=1.100,<3",
  "pydantic>=2.11,<3",
  "uvicorn[standard]>=0.35,<1",
  "qdrant-client>=1.19,<1.20",
  "fastembed>=0.9,<0.10",
  "pypdf>=6,<7",
  "pypdfium2>=5,<6",
  "filelock>=3.16,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

